# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json

minimum_prek_version = "0.5.3"
default_install_hook_types = ["pre-commit", "pre-push"]
default_stages = ["pre-commit", "pre-push", "manual"]

[[repos]]
repo = "meta"
hooks = [
    { id = "check-useless-excludes" },
]

[[repos]]
repo = "builtin"
hooks = [
    { id = "no-commit-to-branch", groups = ["local-only"] },
    { id = "forbid-new-submodules" },
    { id = "check-added-large-files", args = ["--enforce-all"], exclude = "^(resources/icd/2018_I(9|10)gem\\.txt|results/eda/[^/]+\\.pdf)$" },
    # Celý sešit EDA s vektorovými grafy přeroste 500 KB; vlastní strop hlídá dál nečekaně velký render.
    { id = "check-added-large-files", name = "check for added large files (EDA PDF)", args = ["--enforce-all", "--maxkb=2048"], files = "^results/eda/[^/]+\\.pdf$" },
    { id = "check-case-conflict" },
    { id = "check-illegal-windows-names" },
    { id = "check-symlinks" },
    { id = "destroyed-symlinks" },
    { id = "check-executables-have-shebangs" },
    { id = "check-shebang-scripts-are-executable" },
    { id = "check-merge-conflict", args = ["--assume-in-merge"] },
    { id = "detect-private-key" },
    { id = "fix-byte-order-marker" },
    { id = "mixed-line-ending", args = ["--fix=lf"], exclude = "^resources/icd/2018_I(9|10)gem\\.txt$" },
    { id = "trailing-whitespace", exclude = "^resources/icd/2018_I(9|10)gem\\.txt$" },
    # Golden markdown je přesný návrat kable, který nemá koncový newline.
    { id = "end-of-file-fixer", exclude = "^(eda/_freeze/|resources/icd/2018_I(9|10)gem\\.txt$|tests/fixtures/thesis_table/[^/]+\\.md$)" },
    { id = "check-toml" },
    { id = "check-yaml" },
    { id = "check-json" },
    { id = "check-vcs-permalinks" },
]

[[repos]]
repo = "https://github.com/gitleaks/gitleaks"
rev = "v8.30.1"
hooks = [
    { id = "gitleaks", groups = ["ci-job"] },
]

[[repos]]
repo = "local"

[[repos.hooks]]
id = "pixi-lock"
groups = ["ci-job"]
name = "pixi lock --check"
language = "system"
entry = "pixi lock --check"
files = "^(pyproject\\.toml|pixi\\.lock)$"
pass_filenames = false

[[repos.hooks]]
id = "ruff-check"
groups = ["ci-job"]
name = "ruff check"
language = "system"
entry = "pixi run --frozen ruff check --force-exclude"
types_or = ["python", "pyi"]
require_serial = true

[[repos.hooks]]
id = "ruff-format"
groups = ["ci-job"]
name = "ruff format"
language = "system"
entry = "pixi run --frozen ruff format --force-exclude"
types_or = ["python", "pyi"]
require_serial = true

[[repos.hooks]]
id = "ty"
groups = ["ci-job"]
name = "ty check"
language = "system"
entry = "pixi run --frozen ty check"
types_or = ["python", "pyi"]
pass_filenames = false

[[repos.hooks]]
id = "hadolint"
groups = ["ci-job"]
name = "hadolint"
language = "system"
entry = "pixi run --frozen hadolint"
types = ["dockerfile"]

[[repos.hooks]]
id = "snakefmt"
groups = ["ci-job"]
name = "snakefmt"
language = "system"
entry = "pixi run --frozen snakefmt"
files = "(^|/)Snakefile$|\\.smk$"

[[repos.hooks]]
id = "shfmt"
groups = ["ci-job"]
name = "shfmt"
language = "system"
entry = "pixi run --frozen shfmt --write"
types = ["shell"]

[[repos.hooks]]
id = "shellcheck"
groups = ["ci-job"]
name = "ShellCheck"
language = "system"
entry = "pixi run --frozen shellcheck"
types = ["shell"]

[[repos.hooks]]
id = "synthetic-corpus-gate"
groups = ["ci-job"]
name = "brána syntetického korpusu"
language = "system"
entry = "pixi run --frozen mediparse-corpus-gate"
files = "^(resources/synthetic/|config/(mimic_tables|synthetic_plan)\\.json$)"
pass_filenames = false

[[repos.hooks]]
id = "lint-imports"
groups = ["ci-job"]
name = "import-linter"
language = "system"
entry = "pixi run --frozen lint-imports"
types_or = ["python", "pyi", "toml"]
pass_filenames = false
