# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json

minimum_prek_version = "0.5.3"
default_install_hook_types = ["pre-commit", "commit-msg", "pre-push"]
default_stages = ["pre-commit", "pre-push", "manual"]

[[repos]]
repo = "meta"
hooks = [
    { id = "check-useless-excludes" },
]

[[repos]]
repo = "builtin"
hooks = [
    { id = "no-commit-to-branch", groups = ["local-only"] },
    { id = "forbid-new-submodules" },
    { id = "check-added-large-files", args = ["--enforce-all"] },
    { id = "check-case-conflict" },
    { id = "check-illegal-windows-names" },
    { id = "check-symlinks" },
    { id = "destroyed-symlinks" },
    { id = "check-executables-have-shebangs" },
    { id = "check-shebang-scripts-are-executable" },
    { id = "check-merge-conflict", args = ["--assume-in-merge"] },
    { id = "detect-private-key" },
    { id = "fix-byte-order-marker" },
    { id = "mixed-line-ending", args = ["--fix=lf"] },
    { id = "trailing-whitespace" },
    { id = "end-of-file-fixer" },
    { id = "check-toml" },
    { id = "check-yaml" },
    { id = "check-json" },
    { id = "check-vcs-permalinks" },
]

[[repos]]
repo = "https://github.com/gitleaks/gitleaks"
rev = "v8.30.1"
hooks = [
    { id = "gitleaks", groups = ["ci-job"] },
]

[[repos]]
repo = "local"

[[repos.hooks]]
id = "uv-lock"
groups = ["ci-job"]
name = "uv lock --check"
language = "system"
entry = "uv lock --check"
files = "^(pyproject\\.toml|uv\\.lock)$"
pass_filenames = false

[[repos.hooks]]
id = "ruff-check"
groups = ["ci-job"]
name = "ruff check"
language = "system"
entry = "uv run --frozen ruff check --force-exclude"
types_or = ["python", "pyi"]
require_serial = true

[[repos.hooks]]
id = "ruff-format"
groups = ["ci-job"]
name = "ruff format"
language = "system"
entry = "uv run --frozen ruff format --force-exclude"
types_or = ["python", "pyi"]
require_serial = true

[[repos.hooks]]
id = "ty"
groups = ["ci-job"]
name = "ty check"
language = "system"
entry = "uv run --frozen ty check"
types_or = ["python", "pyi"]
pass_filenames = false

[[repos.hooks]]
id = "hadolint"
groups = ["ci-job"]
name = "hadolint"
language = "system"
entry = "uv run --frozen hadolint"
types = ["dockerfile"]

[[repos.hooks]]
id = "synthetic-corpus-gate"
groups = ["ci-job"]
name = "brána syntetického korpusu"
language = "system"
entry = "uv run --frozen python -m mediparse.infrastructure.corpus_gate_cli"
files = "^resources/synthetic/"
pass_filenames = false

[[repos.hooks]]
id = "lint-imports"
groups = ["ci-job"]
name = "import-linter"
language = "system"
entry = "uv run --frozen lint-imports"
types_or = ["python", "pyi", "toml"]
pass_filenames = false

[[repos.hooks]]
id = "commitizen"
name = "cz check"
language = "system"
entry = "uv run --frozen cz check --commit-msg-file"
stages = ["commit-msg"]

[[repos.hooks]]
id = "task-trailer"
name = "trailer Task: SNN"
language = "system"
entry = "grep -Eq '^Task: S[0-9]+$'"
stages = ["commit-msg"]
