[project]
name = "mediparse"
version = "0.1.0"
description = "Repozitar k bakalarske praci zamerene na NLP v lekarskych zpravach. Obsahuje experimenty s klasifikaci nalezu, NER a porovnani klasickych ML metod a transformatorovych modelu na datove sade MIMIC-IV."
readme = "README.md"
authors = [
    { name = "Martin Žoha", email = "193829878+Zohino@users.noreply.github.com" }
]
license = { file = "LICENSE" }
requires-python = ">=3.13"
dependencies = [
    "duckdb>=1.5.6",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.5",
    "scikit-learn>=1.9.1",
    "skops>=0.16.0",
    "snakemake>=9.27.0",
]

[project.scripts]
mediparse-corpus-audit = "mediparse.entrypoints.corpus_audit:main"
mediparse-corpus-check = "mediparse.entrypoints.corpus_consistency:main"
mediparse-corpus-gate = "mediparse.entrypoints.corpus_gate:main"
mediparse-corpus-provenance = "mediparse.entrypoints.corpus_provenance:main"
mediparse-eda-synthetic-tables = "mediparse.entrypoints.eda_synthetic_tables:main"
mediparse-sample-plans = "mediparse.entrypoints.synthetic_plans:main"
mediparse-translation-provenance = "mediparse.entrypoints.translation_provenance:main"
mediparse-verbalization-prompt = "mediparse.entrypoints.verbalization_prompt:main"

[project.urls]
Repository = "https://github.com/Zohino/mediparse"

[build-system]
requires = ["flit_core>=3.12,<4"]
build-backend = "flit_core.buildapi"

[dependency-groups]
dev = [
    { include-group = "lint" },
    { include-group = "test" },
    "commitizen>=4.13.9",
    "prek>=0.5.3",
]
lint = [
    "hadolint-py>=2.15.1.2",
    "import-linter[ui]>=2.15",
    "ruff>=0.16.9",
    "shellcheck-py>=0.11.0.1",
    "shfmt-py>=4.2.0",
    "snakefmt>=2.0.3",
    "ty>=0.0.84",
]
test = [
    "pytest>=9.1.1",
]

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version_scheme = "pep440"
version_provider = "pep621"
update_changelog_on_bump = true
major_version_zero = true

[tool.pytest]
minversion = "9.0"
strict = true
testpaths = ["tests"]
addopts = ["-ra", "--import-mode=importlib"]
filterwarnings = ["error"]

[tool.importlinter]
root_packages = ["mediparse", "tests", "workflow"]
include_external_packages = true
exclude_type_checking_imports = true

[[tool.importlinter.contracts]]
name = "Hexagonální vrstvy mediparse"
type = "layers"
containers = [
    "mediparse",
]
layers = [
    "entrypoints",
    "application | infrastructure",
    "domain",
]
exhaustive = true
broken_contract_guidance = "Doména nezná nic nad sebou. Application a infrastructure se neznají a potkávají se jen v entrypoints: use case popíše potřebu portem (typing.Protocol) a adaptér ji splní. Nový balíček v mediparse je nová vrstva, zařaď ho do kontraktu a důvod napiš do těla commitu."

[[tool.importlinter.contracts]]
name = "Technologie jen v infrastructure"
type = "forbidden"
source_modules = [
    "mediparse.application",
    "mediparse.domain",
    "mediparse.entrypoints",
]
forbidden_modules = [
    "*",
]
allow_indirect_imports = true
unmatched_ignore_imports_alerting = "none"
ignore_imports = [
    "mediparse.** -> __future__",
    "mediparse.** -> collections",
    "mediparse.** -> dataclasses",
    "mediparse.** -> enum",
    "mediparse.** -> itertools",
    "mediparse.** -> types",
    "mediparse.** -> typing",
    "mediparse.domain.** -> datetime",
    "mediparse.domain.** -> hashlib",
    "mediparse.domain.** -> math",
    "mediparse.domain.** -> pydantic",
    "mediparse.domain.** -> re",
    "mediparse.domain.** -> statistics",
    "mediparse.domain.** -> string",
    "mediparse.domain.** -> unicodedata",
    "mediparse.entrypoints.** -> argparse",
    "mediparse.entrypoints.** -> datetime",
    "mediparse.entrypoints.** -> functools",
    "mediparse.entrypoints.** -> logging",
    "mediparse.entrypoints.** -> os",
    "mediparse.entrypoints.** -> pathlib",
    "mediparse.entrypoints.** -> random",
    "mediparse.entrypoints.** -> sys",
]
broken_contract_guidance = "Knihovny, soubory, síť a procesy patří do infrastructure; doména a use casy k nim přistupují přes porty. Modul, který je opravdu čistý, přidej do ignore_imports vědomě a s důvodem v těle commitu."

[[tool.importlinter.contracts]]
name = "Do jádra se vstupuje jen přes entrypoints"
type = "protected"
protected_modules = [
    "mediparse.application",
    "mediparse.domain",
    "mediparse.infrastructure",
]
allowed_importers = [
    "mediparse",
    "tests",
]
broken_contract_guidance = "Zvenku, například ze skriptu Snakemake, se do mediparse vstupuje jen přes mediparse.entrypoints, který složí use case s adaptéry. Chybí-li vstupní bod, přidej ho tam."

[[tool.importlinter.contracts]]
name = "Mediparse je acyklické"
type = "acyclic_siblings"
ancestors = [
    "mediparse",
]
broken_contract_guidance = "Cyklus znamená, že dva moduly jsou ve skutečnosti jeden, nebo jim chybí společný pojem o vrstvu níž."

[[tool.importlinter.contracts]]
name = "Testy nejsou součástí mediparse"
type = "forbidden"
source_modules = [
    "mediparse",
]
forbidden_modules = [
    "tests",
]
broken_contract_guidance = "Produkční kód nesmí záviset na testech; co potřebují oba, patří do mediparse."

[tool.ruff]
fix = true
preview = true
show-fixes = true

[tool.ruff.lint]
future-annotations = true
select = ["ALL"]
# recommended ignore list https://docs.astral.sh/ruff/formatter/#conflicting-lint-rules
ignore = [
    "tab-indentation",
    "indentation-with-invalid-multiple",
    "indentation-with-invalid-multiple-comment",
    "over-indented",
    "incorrect-blank-line-before-class",
    "docstring-tab-indentation",
    "triple-single-quotes",
    "bad-quotes-inline-string",
    "bad-quotes-multiline-string",
    "bad-quotes-docstring",
    "avoidable-escaped-quote",
    "unnecessary-escaped-quote",
    "missing-trailing-comma",
    "prohibited-trailing-comma",
    "line-too-long",

    # Vyjmutá pravidla pro nadbytečnost nebo striktnost, která není v projektu vyžadována
    "missing-copyright-notice", # Copyright je uveden v LICENSE souboru a odkazován v pyproject.toml
    "reimplemented-starmap",    # Nerozliší komprehenzi od generátoru: komprehenze zůstávají, generátory na starmap hlídá review
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "assert",                     # pytest staví na holém assert
    "implicit-namespace-package", # --import-mode=importlib nepotřebuje __init__.py
    "suspicious-non-cryptographic-random-usage", # seedovaná simulace, ne kryptografie
]

"workflow/scripts/**" = [
    "undefined-name",             # globál snakemake vkládá Snakemake před spuštěním skriptu
    "implicit-namespace-package", # skripty spouští Snakemake po souborech, nejsou balíček
]

"translation/**" = [
    "implicit-namespace-package", # skripty spouští pixi po souborech, nejsou balíček
]

"src/mediparse/entrypoints/cli.py" = [
    "error-instead-of-exception", # odmítnutí neplatného vstupu je očekávaný stav: hláška bez tracebacku
]

"src/mediparse/entrypoints/synthetic_plans.py" = [
    "suspicious-non-cryptographic-random-usage", # seedovaná simulace plánů, ne kryptografie
]

"src/mediparse/infrastructure/source_revision.py" = [
    "suspicious-subprocess-import",           # git je pevný příkaz bez shellu a bez vstupu od uživatele
    "subprocess-without-shell-equals-true",   # argumenty jdou jako seznam, shell se nepoužívá
    "start-process-with-partial-path",        # git se hledá v PATH hostitele, cestu k binárce nezná nikdo předem
]

"tests/test_source_revision.py" = [
    "suspicious-subprocess-import",           # test zakládá repo pevným příkazem git bez shellu
    "subprocess-without-shell-equals-true",   # argumenty jdou jako seznam, shell se nepoužívá
    "start-process-with-partial-path",        # git se hledá v PATH, stejně jako v testovaném adaptéru
]

"src/mediparse/entrypoints/smoketest_training.py" = [
    "too-many-arguments", # signatura kroku Snakemake nese všechny vstupy a výstupy pravidla
]

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = ["pydantic.BaseModel"]  # pydantic čte anotace za běhu

[tool.ruff.lint.pydocstyle]
# Use Google-style docstrings.
convention = "google"

[tool.ruff.lint.pylint]
max-nested-blocks = 3

[tool.ruff.format]
docstring-code-format = true

[[tool.ty.overrides]]
include = ["workflow/scripts/**"]

[tool.ty.overrides.rules]
unresolved-reference = "ignore"  # globál snakemake vkládá Snakemake před spuštěním skriptu

[[tool.ty.overrides]]
include = ["translation/**"]

[tool.ty.overrides.analysis]
allowed-unresolved-imports = ["torch", "transformers", "vllm", "vllm.**"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.dependencies]
python = "3.13.*"

[tool.pixi.pypi-dependencies]
mediparse = { path = ".", editable = true }

[tool.pixi.environments]
default = { features = ["dev"], solve-group = "main" }
test = { features = ["test"], solve-group = "main" }
translate = { features = ["translate"], no-default-feature = true, solve-group = "translate" }
eda = { features = ["eda"], solve-group = "main" }

[tool.pixi.feature.translate.dependencies]
python = "3.13.*"

[tool.pixi.feature.translate.pypi-dependencies]
jinja2 = ">=3.1.6"
tokenizers = "==0.23.2"
transformers = "==5.18.0"
vllm = "==0.30.0"

[tool.pixi.feature.eda.dependencies]
quarto = "*"
r-base = "4.5.*"
r-dbi = "*"
r-duckdb = "*"
r-knitr = "*"
r-rmarkdown = "*"
r-reticulate = "*"
r-testthat = "*"
r-withr = "*"
micromamba = "*"
poppler = "*"

[tool.pixi.feature.eda.pypi-dependencies]
numpy = "*"

[tool.pixi.feature.eda.activation.env]
RETICULATE_PYTHON = "$CONDA_PREFIX/bin/python"
RETICULATE_CONDA = "$CONDA_PREFIX/bin/micromamba"

[tool.pixi.feature.eda.tasks]
eda-test = { cmd = "Rscript -e 'testthat::test_dir(\"eda/tests/testthat\", stop_on_failure = TRUE)'", description = "Testy R pomocníků EDA (testthat)" }

[tool.pixi.tasks]
lint = { cmd = "ruff check", description = "Linting pomocí ruff" }
format = { cmd = "ruff format", description = "Formátovat kód pomocí ruff" }
typecheck = { cmd = "ty check", description = "Kontrola statického typování pomocí ty" }
ruff-statistics = { cmd = "ruff check --statistics --no-fix", description = "Statistika lintingu pomocí ruff pro vyloučení omezujících pravidel" }
commit = { cmd = "cz commit", description = "Commit pomocí commitizen" }
smoketest = { cmd = "./smoketest.sh", description = "Smoketest v kontejneru; stejný skript, který spouští zkoušející" }
count-lines = { cmd = "bash scripts/count-lines.sh", description = "Statistiky kódu pomocí tokei jako varování proti overengineeringu" }
build = { cmd = "bash scripts/build.sh", description = "Build kontejnerového image přes podman, nebo docker, s revizí zdroje pro run manifest" }
provenance-translation = { cmd = "mediparse-translation-provenance --workdir \"{{ workdir }}\"", args = [
    { arg = "workdir", default = "build/translation" },
], description = "Provenance českého překladu auditovaného korpusu; ve worktree absolutní cesta hlavního checkoutu" }
audit-corpus = { cmd = "bash scripts/audit-corpus.sh \"{{ discharge }}\" \"{{ radiology }}\" \"{{ report }}\"", args = [
    "discharge",
    "radiology",
    "report",
], description = "Audit syntetického korpusu proti MIMIC-IV-Note; jen lokálně, mimo CI a Claude Code, s commitnutým repem mimo korpus" }
provenance-corpus = { cmd = "bash scripts/provenance-corpus.sh \"{{ model }}\"", args = [
    "model",
], description = "Provenance auditovaného korpusu; commit specifikace z historie docs/synthetic-corpus.md" }
verify-mimic = { cmd = "bash scripts/verify-mimic.sh \"{{ dir }}\"", args = [
    { arg = "dir", default = "resources/mimic" },
], description = "Ověř, že stažené tabulky MIMIC jsou všechny na disku a sedí s otisky v configu" }
