[project]
name = "mediparse"
version = "0.1.0"
description = "Repozitar k bakalarske praci zamerene na NLP v lekarskych zpravach. Obsahuje experimenty s klasifikaci nalezu, NER a porovnani klasickych ML metod a transformatorovych modelu na datove sade MIMIC-IV."
readme = "README.md"
authors = [
    { name = "Martin Žoha", email = "193829878+Zohino@users.noreply.github.com" }
]
license = { file = "LICENSE" }
requires-python = ">=3.13"
dependencies = [
    "duckdb>=1.5.6",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.5",
    "scikit-learn>=1.9.1",
    "skops>=0.16.0",
    "snakemake>=9.27.0",
]

[project.scripts]
mediparse-corpus-audit = "mediparse.entrypoints.corpus_audit:main"
mediparse-corpus-check = "mediparse.entrypoints.corpus_consistency:main"
mediparse-corpus-gate = "mediparse.entrypoints.corpus_gate:main"
mediparse-corpus-provenance = "mediparse.entrypoints.corpus_provenance:main"
mediparse-eda-synthetic-tables = "mediparse.entrypoints.eda_synthetic_tables:main"
mediparse-sample-plans = "mediparse.entrypoints.synthetic_plans:main"
mediparse-synthetic-parameters = "mediparse.entrypoints.synthetic_parameters:main"
mediparse-translation-provenance = "mediparse.entrypoints.translation_provenance:main"
mediparse-verbalization-prompt = "mediparse.entrypoints.verbalization_prompt:main"

[project.urls]
Repository = "https://github.com/Zohino/mediparse"

[build-system]
requires = ["flit_core>=3.12,<4"]
build-backend = "flit_core.buildapi"

[dependency-groups]
dev = [
    { include-group = "lint" },
    { include-group = "test" },
    "prek>=0.5.3",
    "pytest-cov>=7.1.0",
]
lint = [
    "hadolint-py>=2.15.1.2",
    "import-linter[ui]>=2.15",
    "ruff>=0.16.9",
    "shellcheck-py>=0.11.0.1",
    "shfmt-py>=4.2.0",
    "snakefmt>=2.0.3",
    "ty>=0.0.84",
]
test = [
    "pytest>=9.1.1",
    "hypothesis>=6.170.2",
]

[tool.pytest]
minversion = "9.0"
strict = true
testpaths = ["tests"]
addopts = ["-ra", "--import-mode=importlib"]
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["mediparse"]

[tool.importlinter]
root_packages = ["mediparse", "tests", "workflow"]
include_external_packages = true
exclude_type_checking_imports = false

[[tool.importlinter.contracts]]
name = "Hexagonální vrstvy mediparse"
type = "layers"
containers = [
    "mediparse",
]
layers = [
    "entrypoints",
    "application | infrastructure",
    "domain",
]
exhaustive = true
broken_contract_guidance = "Doména nezná nic nad sebou. Application a infrastructure se neznají a potkávají se jen v entrypoints: use case popíše potřebu portem (typing.Protocol) a adaptér ji splní. Nový balíček v mediparse je nová vrstva, zařaď ho do kontraktu a důvod napiš do těla commitu."

[[tool.importlinter.contracts]]
name = "Technologie jen v infrastructure"
type = "forbidden"
source_modules = [
    "mediparse.application",
    "mediparse.domain",
    "mediparse.entrypoints",
]
forbidden_modules = [
    "*",
]
allow_indirect_imports = true
unmatched_ignore_imports_alerting = "none"
ignore_imports = [
    "mediparse.** -> __future__",
    "mediparse.** -> collections",
    "mediparse.** -> dataclasses",
    "mediparse.** -> enum",
    "mediparse.** -> itertools",
    "mediparse.** -> types",
    "mediparse.** -> typing",
    # Jen typy pod TYPE_CHECKING; po modulech, ne po vrstvě, protože import-linter
    # typový import od běhového nerozliší a ruff S311 nechytí random.shuffle ani seed.
    "mediparse.application.cohort -> contextlib",
    "mediparse.application.corpus_audit -> datetime",
    "mediparse.application.plan_sampling -> random",
    "mediparse.domain.mentions -> random",
    "mediparse.domain.note_structure -> random",
    "mediparse.domain.synthetic_patients -> random",
    "mediparse.domain.** -> datetime",
    "mediparse.domain.** -> hashlib",
    "mediparse.domain.** -> math",
    "mediparse.domain.** -> pydantic",
    "mediparse.domain.** -> re",
    "mediparse.domain.** -> statistics",
    "mediparse.domain.** -> string",
    "mediparse.domain.** -> unicodedata",
    "mediparse.entrypoints.** -> argparse",
    "mediparse.entrypoints.** -> datetime",
    "mediparse.entrypoints.** -> functools",
    "mediparse.entrypoints.** -> logging",
    "mediparse.entrypoints.** -> os",
    "mediparse.entrypoints.** -> pathlib",
    "mediparse.entrypoints.** -> random",
    "mediparse.entrypoints.** -> sys",
]
broken_contract_guidance = "Knihovny, soubory, síť a procesy patří do infrastructure; doména a use casy k nim přistupují přes porty. Modul, který je opravdu čistý, přidej do ignore_imports vědomě a s důvodem v těle commitu."

[[tool.importlinter.contracts]]
name = "Do jádra se vstupuje jen přes entrypoints"
type = "protected"
protected_modules = [
    "mediparse.application",
    "mediparse.domain",
    "mediparse.infrastructure",
]
allowed_importers = [
    "mediparse",
    "tests",
]
broken_contract_guidance = "Zvenku, například ze skriptu Snakemake, se do mediparse vstupuje jen přes mediparse.entrypoints, který složí use case s adaptéry. Chybí-li vstupní bod, přidej ho tam."

[[tool.importlinter.contracts]]
name = "Mediparse je acyklické"
type = "acyclic_siblings"
ancestors = [
    "mediparse",
]
broken_contract_guidance = "Cyklus znamená, že dva moduly jsou ve skutečnosti jeden, nebo jim chybí společný pojem o vrstvu níž."

[[tool.importlinter.contracts]]
name = "Testy nejsou součástí mediparse"
type = "forbidden"
source_modules = [
    "mediparse",
]
forbidden_modules = [
    "tests",
]
broken_contract_guidance = "Produkční kód nesmí záviset na testech; co potřebují oba, patří do mediparse."

[[tool.importlinter.contracts]]
name = "Kohorta a split nestojí na smoketestu"
type = "forbidden"
source_modules = [
    "mediparse.entrypoints.cohort",
    "mediparse.application.cohort",
    "mediparse.infrastructure.duckdb_cohort",
    "mediparse.infrastructure.note_table",
    "mediparse.infrastructure.sklearn_split",
    "mediparse.infrastructure.split_config",
    "mediparse.infrastructure.split_table",
    "mediparse.application.split_materialization",
    "mediparse.entrypoints.split_materialization",
    "mediparse.domain.split",
    "mediparse.domain.input_note",
]
forbidden_modules = [
    "mediparse.domain.smoketest_input",
    "mediparse.domain.smoketest_training",
]
broken_contract_guidance = "Řádek vstupu je v domain.input_note a pravidla splitu v domain.split; smoketest_input a smoketest_training jsou jen smoketest."

[[tool.importlinter.contracts]]
name = "Provenance nestojí na auditu korpusu"
type = "forbidden"
source_modules = [
    "mediparse.domain.environment",
    "mediparse.domain.run_manifest",
    "mediparse.domain.cohort",
    "mediparse.domain.corpus_provenance",
    "mediparse.domain.digest",
]
forbidden_modules = [
    "mediparse.domain.corpus_audit",
]
broken_contract_guidance = "Typy otisků (Sha256, CommitSha, commit_sha, fingerprint) jsou v domain.digest; corpus_audit je audit syntetického korpusu."

[[tool.importlinter.contracts]]
name = "Kohorta a evaluace nestojí na modelu labelů syntetiky"
type = "forbidden"
source_modules = [
    "mediparse.domain.diagnosis",
    "mediparse.domain.cohort",
    "mediparse.domain.evaluation",
    "mediparse.domain.icd",
    "mediparse.domain.input_note",
    "mediparse.domain.split",
    "mediparse.application.cohort",
    "mediparse.application.model_evaluation",
    "mediparse.entrypoints.cohort",
    "mediparse.infrastructure.duckdb_cohort",
    "mediparse.infrastructure.note_table",
]
forbidden_modules = [
    "mediparse.domain.labels",
]
broken_contract_guidance = "Diagnóza je v domain.diagnosis; labels je model labelů syntetiky (prevalence, IPF)."

[[tool.importlinter.contracts]]
name = "Typy plánu syntetiky nestojí na losování pacientů"
type = "forbidden"
source_modules = [
    "mediparse.domain.note_structure",
    "mediparse.domain.mentions",
    "mediparse.domain.note_plan",
    "mediparse.domain.synthetic_plan",
    "mediparse.domain.synthetic_note",
]
forbidden_modules = [
    "mediparse.domain.synthetic_patients",
]
broken_contract_guidance = "SyntheticNote je v domain.synthetic_note a PatientModel v domain.synthetic_plan; synthetic_patients je jen algoritmus losování."

[tool.ruff]
fix = true
preview = true
show-fixes = true

[tool.ruff.lint]
future-annotations = true
select = ["ALL"]
# recommended ignore list https://docs.astral.sh/ruff/formatter/#conflicting-lint-rules
ignore = [
    "tab-indentation",
    "indentation-with-invalid-multiple",
    "indentation-with-invalid-multiple-comment",
    "over-indented",
    "incorrect-blank-line-before-class",
    "docstring-tab-indentation",
    "triple-single-quotes",
    "bad-quotes-inline-string",
    "bad-quotes-multiline-string",
    "bad-quotes-docstring",
    "avoidable-escaped-quote",
    "unnecessary-escaped-quote",
    "missing-trailing-comma",
    "prohibited-trailing-comma",
    "line-too-long",

    # Vyjmutá pravidla pro nadbytečnost nebo striktnost, která není v projektu vyžadována
    "missing-copyright-notice", # Copyright je uveden v LICENSE souboru a odkazován v pyproject.toml
    "reimplemented-starmap",    # Nerozliší komprehenzi od generátoru: komprehenze zůstávají, generátory na starmap hlídá review
    "docstring-extraneous-exception", # Raises: patří ke kontraktu i u výjimky, kterou funkce propouští z volaného kódu
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "assert",                     # pytest staví na holém assert
    "implicit-namespace-package", # --import-mode=importlib nepotřebuje __init__.py
    "suspicious-non-cryptographic-random-usage", # seedovaná simulace, ne kryptografie
]

"workflow/scripts/**" = [
    "undefined-name",             # globál snakemake vkládá Snakemake před spuštěním skriptu
    "implicit-namespace-package", # skripty spouští Snakemake po souborech, nejsou balíček
]

"translation/**" = [
    "implicit-namespace-package", # skripty spouští pixi po souborech, nejsou balíček
]

"src/mediparse/entrypoints/cli.py" = [
    "error-instead-of-exception", # odmítnutí neplatného vstupu je očekávaný stav: hláška bez tracebacku
]

"src/mediparse/entrypoints/synthetic_plans.py" = [
    "suspicious-non-cryptographic-random-usage", # seedovaná simulace plánů, ne kryptografie
]

"src/mediparse/infrastructure/source_revision.py" = [
    "suspicious-subprocess-import",           # git je pevný příkaz bez shellu a bez vstupu od uživatele
    "subprocess-without-shell-equals-true",   # argumenty jdou jako seznam, shell se nepoužívá
    "start-process-with-partial-path",        # git se hledá v PATH hostitele, cestu k binárce nezná nikdo předem
]

"tests/model_support.py" = [
    "too-many-arguments", # builder nese pole Prediction; ta, na kterých test nestojí, mají výchozí hodnotu
]

"tests/git_support.py" = [
    "suspicious-subprocess-import",           # test zakládá repo pevným příkazem git bez shellu
    "subprocess-without-shell-equals-true",   # argumenty jdou jako seznam, shell se nepoužívá
    "start-process-with-partial-path",        # git se hledá v PATH, stejně jako v testovaném adaptéru
]

"tests/test_download_script.py" = [
    "suspicious-subprocess-import",           # test spouští shellový skript pravidla, jinak ho pokrýt nejde
    "subprocess-without-shell-equals-true",   # argumenty jdou jako seznam, shell se nepoužívá
    "start-process-with-partial-path",        # bash se hledá v PATH, stejně jako ho volá Snakemake
    "hardcoded-password-string",              # heslo lokálního testovacího serveru, ne přihlášení k PhysioNetu
]

"tests/test_inventory_script.py" = [
    "suspicious-subprocess-import",           # test spouští shellový skript pravidla, jinak ho pokrýt nejde
    "subprocess-without-shell-equals-true",   # argumenty jdou jako seznam, shell se nepoužívá
    "start-process-with-partial-path",        # bash se hledá v PATH, stejně jako ho volá Snakemake
]

"tests/test_eda_canary_script.py" = [
    "suspicious-subprocess-import",           # test spouští shellovou funkci kanárka, jinak ji pokrýt nejde
    "subprocess-without-shell-equals-true",   # argumenty jdou jako seznam, skript se předává bashi jako soubor
    "start-process-with-partial-path",        # bash se hledá v PATH, stejně jako ho volá pixi task eda-synthetic
]

"tests/test_check_pr_record_script.py" = [
    "suspicious-subprocess-import",           # test spouští kontrolovaný shellový skript, jinak ho pokrýt nejde
    "subprocess-without-shell-equals-true",   # argumenty jdou jako seznam, shell se nepoužívá
    "start-process-with-partial-path",        # bash se hledá v PATH, stejně jako při lokální a CI kontrole PR
]

"src/mediparse/entrypoints/cohort.py" = [
    "too-many-arguments", # signatura kroku Snakemake nese všechny vstupy a výstupy pravidla
]

"src/mediparse/entrypoints/synthetic_mimic.py" = [
    "too-many-arguments", # signatura kroku Snakemake nese všechny vstupy a výstupy pravidla
]

"src/mediparse/entrypoints/smoketest_training.py" = [
    "too-many-arguments", # signatura kroku Snakemake nese všechny vstupy a výstupy pravidla
]

"src/mediparse/entrypoints/smoketest_inference.py" = [
    "too-many-arguments", # signatura kroku Snakemake nese všechny vstupy a výstupy pravidla
]

"src/mediparse/entrypoints/smoketest_summary.py" = [
    "too-many-arguments", # signatura kroku Snakemake nese všechny vstupy a výstupy pravidla
]

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = ["pydantic.BaseModel"]  # pydantic čte anotace za běhu

[tool.ruff.lint.pydocstyle]
# Use Google-style docstrings.
convention = "google"

[tool.ruff.lint.pylint]
max-nested-blocks = 3

[tool.ruff.format]
docstring-code-format = true

[[tool.ty.overrides]]
include = ["workflow/scripts/**"]

[tool.ty.overrides.rules]
unresolved-reference = "ignore"  # globál snakemake vkládá Snakemake před spuštěním skriptu

[[tool.ty.overrides]]
include = ["translation/**"]

[tool.ty.overrides.analysis]
allowed-unresolved-imports = ["torch", "transformers", "vllm", "vllm.**"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.dependencies]
python = "3.13.*"
aria2 = ">=1.37.0,<2"
jq = ">=1.8.2,<2"

[tool.pixi.pypi-dependencies]
mediparse = { path = ".", editable = true }

[tool.pixi.environments]
default = { features = ["dev"], solve-group = "main" }
test = { features = ["test"], solve-group = "main" }
translate = { features = ["translate"], no-default-feature = true, solve-group = "translate" }
eda = { features = ["eda"], solve-group = "main" }

[tool.pixi.feature.translate.dependencies]
python = "3.13.*"

[tool.pixi.feature.translate.pypi-dependencies]
jinja2 = ">=3.1.6"
tokenizers = "==0.23.2"
transformers = "==5.18.0"
vllm = "==0.30.0"

[tool.pixi.feature.eda.dependencies]
quarto = "*"
r-base = "4.5.*"
r-comorbidity = "1.1.*"
r-dbi = "*"
r-duckdb = "*"
r-ggplot2 = "*"
r-jsonlite = "*"
r-knitr = "*"
r-rmarkdown = "*"
r-reticulate = "*"
r-testthat = "*"
r-withr = "*"
micromamba = "*"
poppler = "*"

[tool.pixi.feature.eda.pypi-dependencies]
numpy = "*"
transformers = "==5.18.0"
tokenizers = "==0.23.2"
sentencepiece = ">=0.2.2, <0.3"
protobuf = ">=7.36.2, <8"
jinja2 = ">=3.1.6"

[tool.pixi.feature.eda.activation.env]
RETICULATE_PYTHON = "$CONDA_PREFIX/bin/python"
RETICULATE_CONDA = "$CONDA_PREFIX/bin/micromamba"
TRANSFORMERS_VERBOSITY = "error"

[tool.pixi.feature.eda.tasks]
eda = { cmd = "bash scripts/eda.sh \"{{ n }}\"", args = [
    "n",
], description = "Reálný render dokumentu EDA nad MIMIC; jen uživatel ve vlastním terminálu, s commitnutým repem" }
eda-synthetic = { cmd = "bash scripts/eda-synthetic.sh \"{{ n }}\"", args = [
    { arg = "n", default = "" },
], description = "Render dokumentů EDA nad syntetickými tabulkami v /tmp a kontrola kanárka; bez čísla všechny dokumenty" }
eda-test = { cmd = "Rscript -e 'testthat::test_dir(\"eda/tests/testthat\", stop_on_failure = TRUE)'", description = "Testy R pomocníků EDA (testthat)" }
analysis-test = { cmd = """Rscript -e 'testthat::test_dir("analysis/tests/testthat", stop_on_failure = TRUE)'""", description = "Testy R analýzy experimentů (testthat)" }
analysis-metrics = { cmd = "Rscript analysis/scripts/metrics-report.R \"{{ metrics }}\" \"{{ manifest }}\" \"{{ out }}\" config/diagnosis_candidates.json", args = [
    { arg = "metrics", default = "build/smoketest/metrics.parquet" },
    { arg = "manifest", default = "build/smoketest/run_manifest.json" },
    { arg = "out", default = "build/smoketest/analysis" },
], description = "Tabulka .tex a graf PDF metrik se sidecarem provenance (R, mimo Snakemake)" }

[tool.pixi.tasks]
lint = { cmd = "ruff check", description = "Linting pomocí ruff" }
format = { cmd = "ruff format", description = "Formátovat kód pomocí ruff" }
typecheck = { cmd = "ty check", description = "Kontrola statického typování pomocí ty" }
ruff-statistics = { cmd = "ruff check --statistics --no-fix", description = "Statistika lintingu pomocí ruff pro vyloučení omezujících pravidel" }
smoketest = { cmd = "./smoketest.sh", description = "Smoketest v kontejneru; stejný skript, který spouští zkoušející" }
count-lines = { cmd = "bash scripts/count-lines.sh", description = "Statistiky kódu pomocí tokei jako varování proti overengineeringu" }
build = { cmd = "bash scripts/build.sh", description = "Build kontejnerového image přes podman, nebo docker, s revizí zdroje pro run manifest" }
provenance-translation = { cmd = "mediparse-translation-provenance", description = "Provenance českého překladu auditovaného korpusu; ve worktree s --workdir <absolutní cesta hlavního checkoutu>" }
audit-corpus = { cmd = "bash scripts/audit-corpus.sh \"{{ discharge }}\" \"{{ radiology }}\" \"{{ report }}\"", args = [
    "discharge",
    "radiology",
    "report",
], description = "Audit syntetického korpusu proti MIMIC-IV-Note; jen lokálně, mimo CI a Claude Code, s commitnutým repem mimo korpus" }
provenance-corpus = { cmd = "bash scripts/provenance-corpus.sh \"{{ model }}\"", args = [
    "model",
], description = "Provenance auditovaného korpusu; commit specifikace z historie docs/synthetic-corpus.md" }
synthetic-parameters = { cmd = "mediparse-synthetic-parameters", description = "Převezmi export sešitu 8 do config/synthetic_plan.json; jen uživatel ve vlastním terminálu, mimo Claude Code" }
verify-mimic = { cmd = "bash scripts/verify-mimic.sh \"{{ dir }}\"", args = [
    { arg = "dir", default = "resources/mimic" },
], description = "Ověř, že stažené tabulky MIMIC jsou všechny na disku a sedí s otisky v configu" }
coverage-changed = { cmd = "bash scripts/coverage-changed.sh \"{{ base }}\"", args = [
    { arg = "base", default = "origin/main" },
], description = "Nepokryté řádky a větve modulů src/, kterých se větev dotkla proti základu; bez prahu, podklad pro review" }
