name: Setup pixi environment
description: Nainstaluje zamčenou verzi pixi a prostředí přesně podle pixi.lock.

inputs:
  environments:
    description: Prostředí pixi k instalaci, oddělená mezerou.
    default: default

runs:
  using: composite
  steps:
    - name: Install pixi
      uses: prefix-dev/setup-pixi@9dabb60412d3d2d967a8d682f7ce01317af40514 # v0.11.0
      with:
        pixi-version: v0.73.0
        locked: true
        cache: true
        environments: ${{ inputs.environments }}
