name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 1"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pixi-env
      - name: prek ci-job hooks
        run: >-
          pixi run --frozen prek run --all-files --group ci-job
          --skip gitleaks --skip synthetic-corpus-gate --skip pixi-lock
          --show-diff-on-failure

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pixi-env
      - name: písmo Libertinus pro grafy
        run: bash scripts/install-libertinus.sh
      - name: pytest
        env:
          MEDIPARSE_REQUIRE_THESIS_FONT: "1"
        run: pixi run --frozen pytest
      - name: snakemake dry-run
        run: pixi run --frozen snakemake --dry-run download_mimic

  eda:
    name: EDA
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pixi-env
        with:
          environments: eda
      - name: písmo Libertinus pro grafy
        run: bash scripts/install-libertinus.sh
      - name: testthat
        run: pixi run --frozen eda-test
      - name: render nad syntetickými tabulkami a kanárek
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: pixi run --frozen eda-synthetic
      - name: render z freeze bez dat
        run: |
          pixi run --frozen -e eda quarto render eda
          pdfs=$(find results/eda -maxdepth 1 -name '*.pdf' | wc -l)
          documents=$(find eda -maxdepth 1 -name '*.qmd' | wc -l)
          if [[ "$pdfs" -ne "$documents" ]]; then
            echo "::error::PDF v results/eda ($pdfs) neodpovídá dokumentům eda/*.qmd ($documents)"
            exit 1
          fi

  hygiene:
    name: Repo hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pixi-env
      - name: prek builtin hooks
        run: >-
          pixi run --frozen prek run --all-files --stage pre-commit
          --no-group local-only --no-group ci-job --show-diff-on-failure
      - name: no submodules
        run: |
          submodules=$(git ls-files --stage | awk '$1 == "160000" {print $4}')
          if [[ -n "$submodules" ]]; then
            echo "::error::Repo nesmí obsahovat submoduly: $submodules"
            exit 1
          fi

  container:
    name: Container
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: compose config
        run: docker compose config --quiet
      - name: docker build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Containerfile
          tags: mediparse:ci
          load: true
          build-args: |
            MEDIPARSE_COMMIT=${{ github.event.pull_request.head.sha || github.sha }}
            MEDIPARSE_DIRTY=false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: pytest v kontejneru
        # Hypothesis v CI načte deterministický profil ci podle proměnné CI; do kontejneru ji předá -e.
        run: docker run --rm -e CI mediparse:ci pytest
      - name: smoketest.sh
        env:
          BUILDX_BUILDER: default
          CONTAINER_ENGINE: docker
        run: ./smoketest.sh

  secrets:
    name: Secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read # gitleaks-action čte seznam commitů PR přes API
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_ENABLE_COMMENTS: "false"

  ci-ok:
    name: CI OK
    if: always()
    needs: [lint, test, eda, hygiene, container, secrets]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
